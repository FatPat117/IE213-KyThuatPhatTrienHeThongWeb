name: Continuous Integration

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]

jobs:
    smart-contracts-test:
        name: Smart Contract Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 0

            - name: Initialize Submodules
              run: git submodule update --init --recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: nightly

            - name: Install Dependencies
              run: |
                  cd smart-contracts
                  forge install openzeppelin/openzeppelin-contracts --no-commit
                  forge install foundry-rs/forge-std --no-commit

            - name: Run Forge Tests
              run: |
                  cd smart-contracts
                  forge test -vvv

    backend-test:
        name: Backend Tests (Unit & Integration)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: backend/campaign-service/package-lock.json

            - name: Install Dependencies
              run: |
                  cd backend/campaign-service
                  npm install

            - name: Run Tests
              run: |
                  cd backend/campaign-service
                  npm run test
              env:
                  NODE_ENV: test
                  # Add necessary test env vars here if not handled by mongodb-memory-server

    frontend-test:
        name: Frontend Unit Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install Dependencies
              run: |
                  cd frontend
                  npm install

            - name: Sync Contract Artifacts
              run: |
                  cd frontend
                  npm run sync:contract-artifacts

            - name: Run Unit Tests
              run: |
                  cd frontend
                  npm run test

    frontend-build:
        name: Frontend Build Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install Dependencies
              run: |
                  cd frontend
                  npm install

            - name: Sync Contract Artifacts
              run: |
                  cd frontend
                  npm run sync:contract-artifacts

            - name: Build Next.js App
              run: |
                  cd frontend
                  npm run build
              env:
                  # Next.js often requires these even during build if not mocked
                  NEXT_PUBLIC_ENVIRONMENT: production
                  NEXT_PUBLIC_RPC_URL: ${{ secrets.NEXT_PUBLIC_RPC_URL || 'https://eth-sepolia.g.alchemy.com/v2/dummy' }}

    frontend-e2e:
        name: Frontend E2E Tests (Playwright)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install Dependencies
              working-directory: frontend
              run: npm ci

            - name: Install Playwright Browsers
              working-directory: frontend
              run: npx playwright install --with-deps chromium

            - name: Run E2E Tests
              working-directory: frontend
              run: npm run test:e2e
              env:
                  NEXT_TELEMETRY_DISABLED: "1"
                  NEXT_PUBLIC_API_URL: http://localhost:4000
                  NEXT_PUBLIC_SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
                  NEXT_PUBLIC_CROWDFUNDING_CONTRACT_ADDRESS: "0xC6c147727cE6021e2A309d227c5b73346E38CF72"

            - name: Upload Playwright Report
              if: ${{ failure() }}
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-playwright-report
                  path: |
                      frontend/playwright-report
                      frontend/test-results
                  if-no-files-found: ignore
                  retention-days: 7
