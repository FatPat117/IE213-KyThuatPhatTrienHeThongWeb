name: Continuous Integration

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/campaign-service/package-lock.json

      - name: Install Frontend Deps
        run: |
          cd frontend
          npm ci

      - name: Sync Contract Artifacts
        run: |
          cd frontend
          npm run sync:contract-artifacts

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      # We can add backend linting here if backend has a lint script
      # For now, focusing on frontend which is usually stricter

  smart-contracts-test:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Dependencies
        run: |
          cd smart-contracts
          forge install

      - name: Run Forge Tests
        run: |
          cd smart-contracts
          forge test -vvv

  backend-test:
    name: Backend Tests (Unit & Integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/campaign-service/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend/campaign-service
          npm ci

      - name: Run Tests
        run: |
          cd backend/campaign-service
          npm run test
        env:
          NODE_ENV: test
          # Add necessary test env vars here if not handled by mongodb-memory-server

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Sync Contract Artifacts
        run: |
          cd frontend
          npm run sync:contract-artifacts

      - name: Run Unit Tests
        run: |
          cd frontend
          npm run test

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Sync Contract Artifacts
        run: |
          cd frontend
          npm run sync:contract-artifacts

      - name: Build Next.js App
        run: |
          cd frontend
          npm run build
        env:
          # Next.js often requires these even during build if not mocked
          NEXT_PUBLIC_ENVIRONMENT: production
          NEXT_PUBLIC_RPC_URL: ${{ secrets.NEXT_PUBLIC_RPC_URL || 'https://eth-sepolia.g.alchemy.com/v2/dummy' }}
