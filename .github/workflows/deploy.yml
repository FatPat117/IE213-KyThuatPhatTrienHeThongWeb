name: Build & Deploy to K3s

on:
  push:
    branches: [ main, dev ]

# Huỷ run cũ nếu có run mới hơn trên cùng nhánh
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: gateway
            context: ./backend/gateway
          - name: auth-service
            context: ./backend/auth-service
          - name: user-service
            context: ./backend/user-service
          - name: campaign-service
            context: ./backend/campaign-service
          - name: donation-service
            context: ./backend/donation-service
          - name: certificate-service
            context: ./backend/certificate-service
          - name: transaction-service
            context: ./backend/transaction-service
          - name: listener-service
            context: ./backend/listener-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  deploy:
    name: Deploy to K3s on Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e

            cd ~/IE213-KyThuatPhatTrienHeThongWeb

            # Checkout đúng nhánh được push và pull code mới nhất
            BRANCH="${{ github.ref_name }}"
            git fetch origin
            git checkout $BRANCH
            git pull origin $BRANCH

            # Tạo/cập nhật GHCR pull secret để K3s có thể kéo image từ ghcr.io
            sudo k3s kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GHCR_PAT }} \
              --docker-email=${{ github.actor }}@users.noreply.github.com \
              --dry-run=client -o yaml | sudo k3s kubectl apply -f -

            # Áp dụng cấu hình K8s mới nhất
            sudo k3s kubectl apply -f k8s/backend/

            # Khởi động lại tất cả các deployment để kéo image mới
            sudo k3s kubectl rollout restart deployment \
              gateway \
              auth-service \
              user-service \
              campaign-service \
              donation-service \
              certificate-service \
              transaction-service \
              listener-service

            # Chờ các pod quan trọng khởi động lại thành công
            sudo k3s kubectl rollout status deployment/auth-service --timeout=180s
            sudo k3s kubectl rollout status deployment/campaign-service --timeout=180s
            sudo k3s kubectl rollout status deployment/gateway --timeout=180s

            echo "✅ Deploy thành công lên K3s!"

